name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 10 * *" # 毎月10日 12:00（日本時間）にデータを取り直して公開し直す
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Update market data
        # 取得に失敗しても、リポジトリにある web/data.js のまま公開する
        continue-on-error: true
        run: |
          python build/fetch_data.py --all
          python build/build_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke test
        run: node build/test_engine.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
